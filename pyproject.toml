[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lecturize"
dynamic = ["version"]
description = "Turn hours-long lecture recordings into notes: local transcription with faster-whisper, resumable, with optional local translation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "David Cohen" }]
keywords = ["whisper", "transcription", "lecture", "notes", "translation", "faster-whisper", "ctranslate2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "faster-whisper>=1.1,<2",
  "ctranslate2>=4.0,<5",
  "sentencepiece>=0.2,<0.3",
  "pysbd>=0.3,<0.4",
  "typer>=0.12",
  "rich>=13",
  "platformdirs>=4",
  "python-docx>=1.1",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build"]

[project.scripts]
lecturize = "lecturize.cli:app"

[project.urls]
Homepage = "https://github.com/davidcohenDC/lecturize"
Issues = "https://github.com/davidcohenDC/lecturize/issues"
Changelog = "https://github.com/davidcohenDC/lecturize/releases"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/lecturize"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/tests", "/docs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # typer.Option in defaults is the idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
markers = ["slow: downloads a model and runs the real engine"]
addopts = "-m 'not slow' --strict-markers"
